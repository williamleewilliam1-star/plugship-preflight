name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test cloud scanner
        run: node tests/cloud_scan_test.mjs

      - name: Compile scanner
        run: python -m py_compile scripts/preflight.py scripts/openai_port.py

      - name: Run regression tests
        run: python tests/run_tests.py

      - name: Run self preflight
        run: python scripts/preflight.py .

      - name: Validate JSON manifests
        run: |
          python -m json.tool .claude-plugin/plugin.json >/dev/null
          python -m json.tool .claude-plugin/marketplace.json >/dev/null
          python -m json.tool plugin.json >/dev/null
